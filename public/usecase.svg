<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .boundary { fill: #ffffff; stroke: #334155; stroke-width: 2; stroke-dasharray: 8 6; }
      .actor { fill: none; stroke: #0f172a; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .case { fill: #ecfeff; stroke: #0f766e; stroke-width: 2; }
      .case-text { fill: #0f172a; font: 700 15px Arial, sans-serif; }
      .actor-text { fill: #0f172a; font: 700 18px Arial, sans-serif; }
      .title { fill: #0f172a; font: 700 28px Arial, sans-serif; }
      .label { fill: #475569; font: 13px Arial, sans-serif; }
      .line { stroke: #475569; stroke-width: 2; fill: none; }
      .dash { stroke: #64748b; stroke-width: 2; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="720"/>
  <text class="title" x="640" y="48" text-anchor="middle">Counseling System Use Case Diagram</text>

  <!-- System boundary -->
  <rect class="boundary" x="320" y="90" width="760" height="570" rx="10"/>
  <text class="actor-text" x="700" y="122" text-anchor="middle">Counseling System</text>

  <!-- Guest actor -->
  <circle class="actor" cx="135" cy="170" r="24"/>
  <path class="actor" d="M135 194 L135 270 M90 220 L180 220 M135 270 L100 330 M135 270 L170 330"/>
  <text class="actor-text" x="135" y="365" text-anchor="middle">Guest</text>

  <!-- Counselor actor -->
  <circle class="actor" cx="1160" cy="260" r="24"/>
  <path class="actor" d="M1160 284 L1160 360 M1115 310 L1205 310 M1160 360 L1125 420 M1160 360 L1195 420"/>
  <text class="actor-text" x="1160" y="455" text-anchor="middle">Counselor</text>

  <!-- Use cases -->
  <ellipse class="case" cx="470" cy="180" rx="105" ry="34"/>
  <text class="case-text" x="470" y="185" text-anchor="middle">Register Account</text>

  <ellipse class="case" cx="470" cy="270" rx="105" ry="34"/>
  <text class="case-text" x="470" y="275" text-anchor="middle">Login</text>

  <ellipse class="case" cx="670" cy="180" rx="105" ry="34"/>
  <text class="case-text" x="670" y="185" text-anchor="middle">View Dashboard</text>

  <ellipse class="case" cx="670" cy="270" rx="105" ry="34"/>
  <text class="case-text" x="670" y="275" text-anchor="middle">Manage Students</text>

  <ellipse class="case" cx="670" cy="360" rx="125" ry="34"/>
  <text class="case-text" x="670" y="365" text-anchor="middle">Manage Counseling Cases</text>

  <ellipse class="case" cx="670" cy="450" rx="135" ry="34"/>
  <text class="case-text" x="670" y="455" text-anchor="middle">Manage Counseling Sessions</text>

  <ellipse class="case" cx="875" cy="180" rx="105" ry="34"/>
  <text class="case-text" x="875" y="185" text-anchor="middle">Logout</text>

  <ellipse class="case" cx="875" cy="270" rx="120" ry="34"/>
  <text class="case-text" x="875" y="275" text-anchor="middle">View Session History</text>

  <ellipse class="case" cx="875" cy="360" rx="120" ry="34"/>
  <text class="case-text" x="875" y="365" text-anchor="middle">Generate Case Report</text>

  <ellipse class="case" cx="875" cy="450" rx="105" ry="34"/>
  <text class="case-text" x="875" y="455" text-anchor="middle">Export Records</text>

  <!-- Actor associations -->
  <path class="line" d="M180 190 L365 180"/>
  <path class="line" d="M180 240 L365 270"/>

  <path class="line" d="M1115 250 L980 180"/>
  <path class="line" d="M1115 265 L775 180"/>
  <path class="line" d="M1115 285 L775 270"/>
  <path class="line" d="M1115 305 L795 360"/>
  <path class="line" d="M1115 325 L805 450"/>
  <path class="line" d="M1115 345 L995 270"/>
  <path class="line" d="M1115 365 L995 360"/>
  <path class="line" d="M1115 385 L980 450"/>

  <!-- Include / uses relationships -->
  <path class="dash" d="M670 326 L670 304"/>
  <text class="label" x="705" y="318">includes</text>

  <path class="dash" d="M670 416 L670 394"/>
  <text class="label" x="705" y="408">includes</text>

  <path class="dash" d="M785 360 L755 360"/>
  <text class="label" x="765" y="348">uses</text>

  <path class="dash" d="M790 450 L760 450"/>
  <text class="label" x="760" y="438">exports</text>
</svg>
